[package]
name = "montlivre"
version = "2.3.2"
description = "MontLivre — ranger, lire, régler."
authors = ["Simon Courtois <simoncrts@protonmail.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "montlivre_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Objectif du projet : un installeur d'une dizaine de Mo. Ces réglages pèsent
# lourd dans la balance (~40 % du binaire), ne pas les retirer sans mesurer.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
