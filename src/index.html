<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MontLivre</title>
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/library.css" />
    <link rel="stylesheet" href="css/reader.css" />
    <link rel="stylesheet" href="css/settings.css" />
  </head>
  <body data-view="library" data-accent="ochre" data-theme="papier">
    <div class="grain" aria-hidden="true"></div>

    <!-- Bibliothèque -->
    <main class="view view--library" id="view-library">
      <span class="spine" aria-hidden="true">MontLivre — 2.0.0</span>

      <header class="masthead">
        <h1 class="masthead__title">Biblio<span class="masthead__break">thèque</span></h1>
        <div class="masthead__side">
          <div class="masthead__actions">
            <label class="field">
              <span class="sr-only">Chercher un livre</span>
              <span class="field__icon" data-icon="search" aria-hidden="true"></span>
              <input type="search" id="search" placeholder="Titre, auteur" autocomplete="off" />
            </label>
            <button class="btn btn--solid" id="add-book" type="button">
              <span data-icon="plus" aria-hidden="true"></span>Ajouter
            </button>
            <button class="btn btn--icon" id="go-settings" type="button" aria-label="Réglages">
              <span data-icon="sliders" aria-hidden="true"></span>
            </button>
          </div>
          <p class="masthead__meta" id="library-count"></p>
        </div>
      </header>

      <div class="shelf" id="shelf"></div>

      <div class="empty" id="empty" hidden>
        <div class="empty__shape" data-shape="blob" aria-hidden="true"></div>
        <p class="empty__title">Rien sur l'étagère</p>
        <p class="empty__hint">Déposez un EPUB, MOBI, AZW3, FB2 ou CBZ dans la fenêtre.</p>
      </div>
    </main>

    <!-- Lecteur -->
    <main class="view view--reader" id="view-reader">
      <header class="chrome" id="reader-chrome">
        <button class="btn btn--icon" id="go-library" type="button" aria-label="Retour à la bibliothèque">
          <span data-icon="arrow-left" aria-hidden="true"></span>
        </button>
        <p class="chrome__title" id="running-title"></p>
        <div class="chrome__actions">
          <button class="btn btn--icon" id="toggle-toc" type="button" aria-label="Sommaire" aria-expanded="false">
            <span data-icon="list" aria-hidden="true"></span>
          </button>
          <button class="btn btn--icon" id="reader-settings" type="button" aria-label="Réglages">
            <span data-icon="sliders" aria-hidden="true"></span>
          </button>
        </div>
      </header>

      <nav class="toc" id="toc" hidden aria-label="Sommaire">
        <p class="toc__head">Sommaire</p>
        <ol class="toc__list" id="toc-list"></ol>
      </nav>

      <div class="page" id="page"></div>

      <aside class="note" id="note" hidden aria-live="polite">
        <div class="note__head">
          <span class="note__label" id="note-label">Note</span>
          <button class="note__close" id="note-close" type="button" aria-label="Fermer la note">
            <span data-icon="close" aria-hidden="true"></span>
          </button>
        </div>
        <div class="note__body" id="note-body"></div>
      </aside>

      <footer class="rail">
        <div class="rail__track"><div class="rail__fill" id="rail-fill"></div></div>
        <p class="rail__folio" id="folio"></p>
      </footer>
    </main>

    <!-- Réglages -->
    <main class="view view--settings" id="view-settings">
      <span class="spine" aria-hidden="true">Réglages</span>

      <header class="masthead masthead--plain">
        <h1 class="masthead__title">Réglages</h1>
        <button class="btn btn--icon" id="close-settings" type="button" aria-label="Fermer">
          <span data-icon="close" aria-hidden="true"></span>
        </button>
      </header>

      <div class="settings" id="settings"></div>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
